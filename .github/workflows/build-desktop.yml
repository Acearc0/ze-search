name: Build desktop installers

# 精简版：只出 Windows 安装包。
# 相比官方配置移除：
#   - macOS / Linux job（用户不需要）
#   - native regression / 实机安装 / 桌面功能回归（官方发布验证，与出包无关，最耗时）
#   - 回归证据 artifact 上传
# 保留：依赖安装 → Tauri 构建 → 上传安装包。

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [dev-improvements, v23-custom-search]

permissions:
  contents: read

jobs:
  windows:
    name: windows-x64
    runs-on: windows-2025
    # 精简后正常 10-15 分钟，留足余量
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # 失败也缓存，避免一次编译错误后下次全量重编
          cache-on-failure: true

      - run: npm ci

      - name: Configure installer build
        run: |
          node -e 'require("node:fs").writeFileSync(".tauri-ci.json", JSON.stringify({ bundle: { createUpdaterArtifacts: false, windows: { nsis: { compression: "zlib" } } } }))'

      - name: Build Windows NSIS installer
        run: node scripts/tauri-cli.mjs build --ci --target x86_64-pc-windows-msvc --bundles nsis --config .tauri-ci.json -- --locked

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ZError-windows-x64-${{ github.run_id }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
          overwrite: true